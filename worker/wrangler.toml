# Cloudflare Worker 設定。部署：cd worker，再 npx.cmd wrangler deploy
# 分壇總管理者密碼：npx.cmd wrangler secret put SUPER_PASSWORD（由管理者自己輸入，不寫進程式碼）
name = "region-signup-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
# 分壇行事曆也在這個帳號的 workers.dev 底下：同帳號的 Worker 預設不能直接互連，加這個讓它走公開網路去讀
compatibility_flags = ["global_fetch_strictly_public"]

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[durable_objects.bindings]]
name = "REGION"
class_name = "RegionStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Registry", "RegionStore"]

[observability]
enabled = true
